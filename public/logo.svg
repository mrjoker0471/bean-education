<?xml version="1.0" encoding="utf-8"?>
<!-- BEAN Education public logo asset. Palette: obsidian #0B0B0C / metallic
     gold #C6A05E / champagne #E9DCBD. Swap this single file when the final
     BEAN Education logo is supplied — app icon and metadata point here. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161512"/>
      <stop offset="1" stop-color="#0B0B0C"/>
    </linearGradient>
    <linearGradient id="beanGold" x1="20" y1="13" x2="44" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9DCBD"/>
      <stop offset="0.5" stop-color="#C6A05E"/>
      <stop offset="1" stop-color="#8C744C"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#tile)" stroke="rgba(233,220,189,0.18)" stroke-width="1"/>
  <g transform="rotate(-24 32 32)">
    <ellipse cx="32" cy="32" rx="12.5" ry="17.5" fill="url(#beanGold)"/>
    <path d="M32 15.5 C 23.5 23, 40.5 41, 32 48.5" stroke="#0B0B0C" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
